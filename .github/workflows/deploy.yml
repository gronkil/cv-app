# Wymagane sekrety w ustawieniach repo (Settings > Secrets and variables > Actions):
#   FTP_SERVER      - adres serwera FTP na home.pl (np. s123.home.pl)
#   FTP_USERNAME    - login FTP
#   FTP_PASSWORD    - hasło FTP
#   FTP_REMOTE_DIR  - katalog docelowy subdomeny na serwerze, MUSI kończyć się "/"
#                     (np. /domains/mateusz-markowski.kapatech.pl/public_html/)
name: Deploy to home.pl

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
